name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race -count=1 ./...

      - name: Build binary
        run: go build -buildvcs=false -ldflags "-X main.Version=ci-${GITHUB_SHA::8}" -o bin/vismo ./cmd/vismo

  # TODO: Lint job is temporarily disabled.
  # golangci-lint does not yet support Go 1.25 (binary builds are made with Go 1.24).
